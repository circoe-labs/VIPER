# Local development database only. Credentials are local-dev defaults, not secrets;
# the port is bound to loopback. Host port 5442 avoids other local projects on 5432.
name: viper

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viper
      POSTGRES_PASSWORD: viper
      POSTGRES_DB: viper
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first initialised: creates the `viper_test` database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viper -d viper"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
