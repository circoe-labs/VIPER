name: CI

on:
  push:
    branches: [main, claude]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PRIVACY: the repository is public. Never add `actions/upload-artifact` (or any upload/cache of
# test outputs, reports, traces or screenshots) to this workflow. Only synthetic fixtures exist in git.

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/check_private_data.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viper
          POSTGRES_PASSWORD: viper
          POSTGRES_DB: viper_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U viper -d viper_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VIPER_TEST_DATABASE_URL: postgresql+psycopg://viper:viper@127.0.0.1:5442/viper_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - run: ruff format --check . ../scripts
      - run: mypy
      - name: Migration CLI smoke (upgrade / downgrade / upgrade) and idempotent seed
        run: |
          alembic -x db=test upgrade head
          alembic -x db=test downgrade base
          alembic -x db=test upgrade head
          python -m app.seed --db test
          python -m app.seed --db test
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viper
          POSTGRES_PASSWORD: viper
          POSTGRES_DB: viper_e2e
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U viper -d viper_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Full stack: Playwright starts uvicorn on `viper_e2e` (port 8044) and Vite (5180); global setup migrates the
      # database and creates the E2E account with a random password (frontend/e2e/global-setup.ts).
      - run: npm run e2e
