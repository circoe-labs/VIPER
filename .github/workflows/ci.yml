name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject private workbook artifacts
        run: |
          if find . -type f \( -name 'BASE_CLIENT.xlsx' -o -path '*/sources/*' \) | grep .; then exit 1; fi
