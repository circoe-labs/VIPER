# Production stack for viper.circoe.com: Postgres, the API, Caddy (HTTPS + SPA + proxy).
# Secrets come from deploy/.env (never committed): see deploy/.env.example.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: viper-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: viper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viper -d viper"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the API reaches it.

  api:
    image: viper-prod-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIPER_DATABASE_URL: postgresql+psycopg://viper:${POSTGRES_PASSWORD}@db:5432/viper
      VIPER_SQL_READER_PASSWORD: ${SQL_READER_PASSWORD:?set SQL_READER_PASSWORD in deploy/.env}
      VIPER_SESSION_COOKIE_SECURE: "true"
      VIPER_TOOLBOX_OAUTH_REDIRECT_URI: https://${VIPER_DOMAIN}/settings/connections
      # « Se connecter avec Infomaniak »: once both are set, it replaces the password form.
      VIPER_INFOMANIAK_CLIENT_ID: ${INFOMANIAK_CLIENT_ID:-}
      VIPER_INFOMANIAK_CLIENT_SECRET: ${INFOMANIAK_CLIENT_SECRET:-}
    volumes:
      - viper_home:/root/.viper

  web:
    image: viper-prod-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VIPER_DOMAIN: ${VIPER_DOMAIN:?set VIPER_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  viper_home:
  caddy_data:
  caddy_config:
